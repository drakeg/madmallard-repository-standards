name: Standards validation
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Test scripts
        run: python3 -m unittest discover -s tests -v
      - name: Audit required docs
        run: python3 scripts/audit.py --check
      - name: Verify badges have no drift
        run: python3 scripts/badges.py --mode check
